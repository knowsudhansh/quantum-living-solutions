name: Temporary Security Audit

on:
  push:
    branches: [ temp-phase1-validation ]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Execute Security Audit
        id: run-audit
        shell: bash
        run: |
          # Execute npm audit and capture JSON output, allowing non-zero exits (vulnerability findings exit with non-zero code)
          npm audit --json > audit-report.json || audit_exit_code=$?
          echo "npm audit exited with process code: ${audit_exit_code:-0}"
          
          # Validate JSON structure
          if [ -f audit-report.json ] && jq -e '.metadata.vulnerabilities' audit-report.json > /dev/null 2>&1; then
            echo "Audit report structurally valid."
            echo "audit_valid=true" >> "$GITHUB_OUTPUT"
            echo "audit_exit_code=${audit_exit_code:-0}" >> "$GITHUB_OUTPUT"
          else
            echo "Error: Audit report is structurally invalid or missing metadata."
            echo "audit_valid=false" >> "$GITHUB_OUTPUT"
            
            # Print only safe parsed diagnostics
            if [ -f audit-report.json ]; then
              echo "file exists: yes"
              if jq . audit-report.json >/dev/null 2>&1; then
                echo "valid JSON: yes"
                echo "top-level keys: $(jq -r 'keys | join(", ")' audit-report.json)"
                jq -r 'if .message then "message: \(.message)" else empty end' audit-report.json || true
                jq -r 'if .error?.summary then "error.summary: \(.error.summary)" else empty end' audit-report.json || true
                jq -r 'if .error?.detail then "error.detail: \(.error.detail)" else empty end' audit-report.json || true
              else
                echo "valid JSON: no"
              fi
            else
              echo "file exists: no"
            fi
          fi

      - name: Output Readable Audit Summary
        if: steps.run-audit.outputs.audit_valid == 'true'
        shell: bash
        run: |
          echo "=== Vulnerability Summary ==="
          jq '.metadata.vulnerabilities' audit-report.json

      - name: Upload Audit JSON Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-audit-report
          path: audit-report.json
          retention-days: 5

      - name: Final Result Gate
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.run-audit.outputs.audit_valid }}" = "true" ]; then
            echo "Success: Valid npm audit report was successfully retrieved."
            exit 0
          else
            echo "Failure: Audit could not be retrieved or structural validation failed."
            exit 1
          fi
